<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ashwin S R</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed B&W video hero, then a quiet numbered index of work; separate pages for About, Experience, Contact; case pages walk through a flow one screen at a time. */
:root {
  --bg: #ffffff;
  --fg: #0b0b0b;
  --muted: #6e6e6e;
  --line: #e4e4e4;
  --panel: #f2f2f2;
  --inv-bg: #0b0b0b;
  --inv-fg: #ffffff;
  --sans: "Geist", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-1: 0.8125rem; --s0: 1rem; --s1: 1.25rem; --s2: clamp(1.35rem, 2.2vw, 1.75rem); --s3: clamp(2rem, 4.4vw, 3.5rem); --s4: clamp(2.6rem, 8vw, 7.5rem); --s5: clamp(3.2rem, 11vw, 10.5rem);
  --ease: cubic-bezier(.16, 1, .3, 1);
  --ease-io: cubic-bezier(.76, 0, .24, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b0b0b; --fg: #f5f5f5; --muted: #8f8f8f; --line: #262626; --panel: #161616; --inv-bg: #f5f5f5; --inv-fg: #0b0b0b; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0b0b0b; --fg: #f5f5f5; --muted: #8f8f8f; --line: #262626; --panel: #161616; --inv-bg: #f5f5f5; --inv-fg: #0b0b0b; color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: var(--s0); line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: clip; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
a { color: inherit; text-decoration: none; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; }
h1, h2, h3 { font-weight: 500; letter-spacing: -0.035em; line-height: 1.02; text-wrap: balance; }
img, video { display: block; max-width: 100%; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
::selection { background: var(--fg); color: var(--bg); }
html.lenis, html.lenis body { height: auto; }
.lenis.lenis-smooth { scroll-behavior: auto !important; }

.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); }
@media (max-width: 520px) { .wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.label { font-family: var(--mono); font-size: var(--s-1); color: var(--muted); letter-spacing: 0.02em; text-transform: uppercase; }
.muted { color: var(--muted); }
.measure { max-width: 60ch; }

/* split lines: each line slides up from a mask */
.line { display: block; overflow: hidden; padding-bottom: 0.06em; margin-bottom: -0.06em; }
.line > span { display: inline-block; will-change: transform; }

/* roll link: text rolls up on hover */
.roll { display: inline-flex; overflow: hidden; height: 1.3em; line-height: 1.3em; vertical-align: bottom; }
.roll > span { display: flex; flex-direction: column; transition: transform .55s var(--ease); }
.roll > span > span { height: 1.3em; }
a:hover .roll > span, button:hover .roll > span, .roll:hover > span { transform: translateY(-50%); }

/* underline draw */
.uline { background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size .6s var(--ease); padding-bottom: 2px; }
.uline:hover, a:hover > .uline { background-size: 100% 1px; }

/* header */
header.top { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 50; color: var(--fg); transition: color .5s var(--ease), transform .6s var(--ease), background-color .5s var(--ease); }
header.top.over { color: #fff; }
header.top.solid { background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
header.top.hide { transform: translateY(-110%); }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 500; }
.brand img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; filter: grayscale(1) contrast(1.05); transition: transform .6s var(--ease); }
.brand:hover img { transform: rotate(-12deg) scale(1.08); }
.top nav { display: flex; gap: 26px; font-size: 0.9375rem; }
.top nav a { position: relative; opacity: .7; transition: opacity .3s; }
.top nav a:hover, .top nav a[aria-current="true"] { opacity: 1; }
.top nav a[aria-current="true"]::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: currentColor; }
.top-r { display: flex; align-items: center; gap: 28px; }
/* sound toggle */
.snd { display: inline-flex; align-items: center; gap: 9px; height: 44px; font-family: var(--mono); font-size: var(--s-1); letter-spacing: .02em; opacity: .75; transition: opacity .3s; }
.snd:hover, .snd[aria-pressed="true"] { opacity: 1; }
.snd .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.snd .bars i { display: block; width: 2px; height: 100%; background: currentColor; border-radius: 1px; transform: scaleY(.4); transform-origin: bottom; transition: transform .5s var(--ease); }
.snd[aria-pressed="true"] .bars i { animation: eq 1s ease-in-out infinite alternate; }
.snd[aria-pressed="true"] .bars i:nth-child(2) { animation-duration: .7s; animation-delay: -.3s; }
.snd[aria-pressed="true"] .bars i:nth-child(3) { animation-duration: 1.2s; animation-delay: -.6s; }
.snd[aria-pressed="true"] .bars i:nth-child(4) { animation-duration: .85s; animation-delay: -.2s; }
@keyframes eq { 0% { transform: scaleY(.2); } 100% { transform: scaleY(1); } }
@media (prefers-reduced-motion: reduce) { .snd[aria-pressed="true"] .bars i { animation: none; transform: scaleY(.7); } }
/* mobile menu */
.burger { display: none; position: relative; width: 44px; height: 44px; margin-right: -10px; z-index: 2; }
.burger i { position: absolute; left: 11px; right: 11px; height: 1.5px; background: currentColor; border-radius: 2px; transition: transform .5s var(--ease), opacity .3s, top .5s var(--ease); }
.burger i:nth-child(1) { top: 15px; } .burger i:nth-child(2) { top: 21.25px; } .burger i:nth-child(3) { top: 27.5px; }
.menu-open .burger i:nth-child(1) { top: 21.25px; transform: rotate(45deg); }
.menu-open .burger i:nth-child(2) { opacity: 0; transform: scaleX(0); }
.menu-open .burger i:nth-child(3) { top: 21.25px; transform: rotate(-45deg); }
.mmenu { position: fixed; inset: 0; z-index: 45; background: var(--inv-bg); color: var(--inv-fg); display: grid; grid-template-rows: 1fr auto; padding: calc(env(safe-area-inset-top, 0px) + 96px) max(20px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 28px) max(20px, env(safe-area-inset-left, 0px)); clip-path: circle(0% at calc(100% - 38px) 42px); visibility: hidden; transition: clip-path .8s var(--ease-io), visibility 0s .8s; }
.menu-open .mmenu { clip-path: circle(150% at calc(100% - 38px) 42px); visibility: visible; transition: clip-path .8s var(--ease-io), visibility 0s; }
.mmenu ol { list-style: none; padding: 0; margin: 0; display: grid; align-content: start; gap: 4px; counter-reset: m; }
.mmenu li { overflow: hidden; border-bottom: 1px solid color-mix(in srgb, var(--inv-fg) 16%, transparent); }
.mmenu li a { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 14px; font-size: clamp(2.2rem, 11vw, 3.6rem); font-weight: 500; letter-spacing: -0.045em; line-height: 1.05; transform: translateY(105%); transition: transform .7s var(--ease); }
.mmenu li a span { font-family: var(--mono); font-size: var(--s-1); letter-spacing: .02em; opacity: .55; }
.menu-open .mmenu li a { transform: none; }
.menu-open .mmenu li:nth-child(1) a { transition-delay: .25s; } .menu-open .mmenu li:nth-child(2) a { transition-delay: .31s; } .menu-open .mmenu li:nth-child(3) a { transition-delay: .37s; } .menu-open .mmenu li:nth-child(4) a { transition-delay: .43s; } .menu-open .mmenu li:nth-child(5) a { transition-delay: .49s; }
.mmenu li a[aria-current="true"] { font-style: normal; text-decoration: underline; text-decoration-thickness: .05em; text-underline-offset: .12em; }
.mmenu-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px 20px; opacity: 0; transform: translateY(12px); transition: opacity .5s, transform .6s var(--ease); }
.menu-open .mmenu-foot { opacity: 1; transform: none; transition-delay: .55s; }
.mmenu-foot nav { display: flex; gap: 20px; }
.mmenu-foot .addr { font-family: var(--mono); font-size: var(--s-1); opacity: .6; user-select: all; overflow-wrap: anywhere; }
.menu-open header.top { color: var(--inv-fg) !important; background: transparent !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
@media (max-width: 760px) {
  .top nav.main-nav { display: none; }
  .burger { display: block; }
  .top-r { gap: 6px; }
  .snd { padding-inline: 8px; }
  .snd .snd-t { display: none; }
}
@media (min-width: 761px) { .mmenu { display: none; } }

/* page wipe */
.wipe { position: fixed; inset: 0; z-index: 90; background: var(--inv-bg); color: var(--inv-fg); visibility: hidden; pointer-events: none; display: grid; place-items: center; }
.wipe b { font-weight: 500; font-size: var(--s3); letter-spacing: -0.03em; overflow: hidden; }
.wipe b span { display: inline-block; }

/* cursor */
.cursor { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; mix-blend-mode: difference; display: none; }
.cursor i { display: grid; place-items: center; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: #fff; transition: width .45s var(--ease), height .45s var(--ease), margin .45s var(--ease); font-style: normal; font-family: var(--mono); font-size: 11px; color: #000; text-transform: uppercase; letter-spacing: .04em; }
.cursor i span { opacity: 0; transition: opacity .25s; }
.cursor.big i { width: 84px; height: 84px; margin: -42px 0 0 -42px; }
.cursor.big i span { opacity: 1; }
.cursor.down i { transform: scale(.8); }
@media (hover: hover) and (pointer: fine) { .cursor { display: block; } }

/* hero: sticky video, "Hello" + a long name line that slides sideways with scroll */
.hero { position: relative; height: 100svh; min-height: 560px; color: #fff; background: #000; }
.js .hero { height: 190svh; }
.hero-sticky { position: sticky; top: 0; height: 100svh; min-height: 560px; overflow: hidden; }
.hero video, .hero .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.08) brightness(.6); }
.hero-sticky::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.05) 35%, rgba(0,0,0,.55)); }
.hero-text { position: absolute; inset: 0; z-index: 2; display: grid; grid-template-rows: 1fr auto; grid-template-columns: minmax(0, 1fr); padding-block: calc(env(safe-area-inset-top, 0px) + 90px) clamp(28px, 5vw, 56px); }
.hero-h1 { align-self: end; font-weight: 500; letter-spacing: -0.055em; line-height: .98; display: grid; gap: .02em; }
.hero-h1 .line { white-space: nowrap; will-change: transform; font-size: clamp(2.4rem, 9vw, 10rem); }
.hero-h1 .l2 { text-align: right; font-weight: 300; }
.hero-h1 .l1 .lite { font-weight: 300; color: rgba(255,255,255,.7); }
.hero-row { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-top: clamp(20px, 3vw, 36px); }
.hero-row p { max-width: 38ch; color: rgba(255,255,255,.85); font-size: var(--s1); line-height: 1.45; }
.scroll-cue { display: inline-flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: var(--s-1); text-transform: uppercase; letter-spacing: .04em; color: rgba(255,255,255,.78); }
.scroll-cue i { position: relative; width: 1px; height: 44px; background: rgba(255,255,255,.3); overflow: hidden; }
.scroll-cue i::after { content: ""; position: absolute; inset: 0; background: #fff; animation: drip 2.2s var(--ease-io) infinite; }
@keyframes drip { 0% { transform: translateY(-100%); } 60%, 100% { transform: translateY(100%); } }

.centre-say { padding-block: clamp(100px, 15vw, 200px) clamp(30px, 5vw, 60px); text-align: center; overflow-x: clip; }
.centre-say h2 { font-size: clamp(2.1rem, 6.4vw, 6.25rem); letter-spacing: -0.05em; line-height: 1.02; }
.centre-say .line { padding-inline: .05em; }

/* projects page */
.filters { display: flex; flex-wrap: wrap; gap: 8px; }
.filter { padding: 9px 18px; border: 1px solid var(--line); border-radius: 999px; font-size: 0.9375rem; transition: background-color .4s var(--ease), color .4s, border-color .4s; }
.filter sup { font-family: var(--mono); font-size: .65em; opacity: .6; }
.filter:hover { border-color: var(--fg); }
.filter.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(36px, 5vw, 72px) clamp(16px, 2.4vw, 32px); }
@media (max-width: 700px) { .pgrid { grid-template-columns: minmax(0, 1fr); } }
.pcard { display: grid; gap: 14px; min-width: 0; }
.pcard[hidden] { display: none !important; }
.pshot { position: relative; aspect-ratio: 5 / 4; max-width: 100%; border-radius: 6px; overflow: hidden; background: var(--panel); display: flex; align-items: center; justify-content: center; gap: 6%; transition: background-color .7s var(--ease); }
.pshot img { height: 76%; width: auto; filter: drop-shadow(0 20px 34px rgba(0,0,0,.2)); transition: transform .9s var(--ease); }
.pshot img + img { transform: translateY(6%); }
.pcard.web .pshot img { height: auto; width: 82%; border-radius: 4px; box-shadow: 0 18px 40px -14px rgba(0,0,0,.3); filter: none; }
.pcard.web .pshot img + img { display: none; }
.pcard:hover .pshot { background: var(--tint); }
.pcard:hover .pshot img { transform: translateY(-3%) rotate(-2deg); }
.pcard:hover .pshot img + img { transform: translateY(2%) rotate(2deg); }
.pmeta { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 14px; }
.pmeta h3 { font-size: clamp(1.4rem, 2.6vw, 2.1rem); letter-spacing: -0.03em; transition: transform .6s var(--ease); }
.pcard:hover .pmeta h3 { transform: translateX(8px); }
.pcard > p { margin-top: -8px; }

/* about intro: words light up on scroll; a circle under the pointer reveals a second text */
.about-intro { padding-block: clamp(40px, 6vw, 80px) clamp(90px, 13vw, 180px); overflow-x: clip; }
.about-intro .label { margin-bottom: clamp(20px, 3vw, 32px); display: block; }
.ri { position: relative; cursor: none; touch-action: pan-y; }
.ri p { font-size: clamp(1.75rem, 4.6vw, 4.25rem); font-weight: 500; letter-spacing: -0.04em; line-height: 1.1; max-width: 24ch; text-wrap: pretty; }
.js .ri-base .w { opacity: .14; }
.ri-base .hl { text-decoration: underline; text-decoration-thickness: .06em; text-underline-offset: .14em; }
.ri-mask { position: absolute; inset: -240px; padding: 240px; background: var(--fg); color: var(--bg); clip-path: circle(0px at 50% 50%); pointer-events: none; }
.ri-mask p { max-width: 24ch; }
@media (hover: none) { .ri { cursor: auto; } }

/* marquee */
.marquee { overflow: hidden; border-block: 1px solid var(--line); padding-block: 22px; white-space: nowrap; }
.marquee-track { display: inline-flex; gap: 48px; padding-right: 48px; font-size: var(--s2); letter-spacing: -0.02em; will-change: transform; }
.marquee-track span { display: inline-flex; align-items: center; gap: 48px; }
.marquee-track span::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--fg); }

/* sections */
section.block { padding-block: clamp(80px, 12vw, 160px); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; margin-bottom: clamp(36px, 5vw, 64px); }
.sec-head h2 { font-size: var(--s4); }

/* stats */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--line); }
.stats div { padding: 28px 0 0; display: grid; gap: 6px; }
.stats div + div { padding-left: 24px; border-left: 1px solid var(--line); }
.stats b { font-size: var(--s3); font-weight: 500; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; line-height: 1; }
@media (max-width: 560px) { .stats { grid-template-columns: minmax(0, 1fr); } .stats div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); margin-top: 24px; } }
.intro-lede { font-size: var(--s3); letter-spacing: -0.035em; line-height: 1.12; max-width: 22ch; font-weight: 400; }
.intro-lede .w, .ri-base .w { display: inline-block; }

/* work index: the whole section takes the hovered project's colour */
.tintable { transition: background-color .7s var(--ease), color .5s var(--ease); }
.tintable.tint { background: var(--tint); color: #fff; }
.tintable.tint .label, .tintable.tint .muted { color: rgba(255,255,255,.72); }
.index { list-style: none; padding: 0; border-top: 1px solid var(--line); transition: border-color .5s; }
.row { border-bottom: 1px solid var(--line); transition: border-color .5s; }
.tint .index, .tint .row { border-color: rgba(255,255,255,.22); }
.row a { display: grid; grid-template-columns: 3.5rem minmax(0, 1.4fr) minmax(0, 1fr) auto; align-items: center; gap: 24px; padding-block: clamp(20px, 2.6vw, 32px); }
.row .num { font-family: var(--mono); font-size: var(--s-1); color: var(--muted); transition: color .5s; }
.row h3 { display: flex; align-items: baseline; font-size: clamp(1.7rem, 4.4vw, 3.6rem); transition: opacity .5s var(--ease), transform .7s var(--ease); }
.row h3 .ar { display: inline-block; width: 0; overflow: hidden; opacity: 0; transition: width .6s var(--ease), opacity .4s; white-space: nowrap; }
.row h3 sup { font-family: var(--mono); font-size: 0.7rem; letter-spacing: .02em; margin-left: .5em; color: var(--muted); font-weight: 400; transform: translateY(-1.6em); text-transform: lowercase; transition: color .5s; }
.row .type { color: var(--muted); transition: color .5s; }
.row .go { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: transform .6s var(--ease), border-color .4s; }
.tint .row .num, .tint .row .type, .tint .row h3 sup { color: rgba(255,255,255,.72); }
.tint .row .go { border-color: rgba(255,255,255,.4); }
.tint .row:not(.on) h3 { opacity: .42; }
.row.on h3 .ar { width: 1.1em; opacity: 1; }
.row.on .go { transform: rotate(-45deg); border-color: #fff; }
@media (max-width: 820px) { .row a { grid-template-columns: 2.25rem minmax(0, 1fr) auto; } .row .type { display: none; } }
@media (hover: none) { .row .go { display: none; } .row a { grid-template-columns: 2.25rem minmax(0, 1fr); } }

/* last section: a big line that pans with the pointer */
.last { border-top: 1px solid var(--line); overflow: hidden; padding-top: clamp(80px, 12vw, 170px); }
.last-line { display: block; width: max-content; white-space: nowrap; font-size: clamp(3.4rem, 11vw, 11rem); font-weight: 500; letter-spacing: -0.055em; line-height: 1.05; padding-inline: max(28px, env(safe-area-inset-left, 0px)); will-change: transform; }
.last-line .q { color: color-mix(in srgb, var(--fg) 28%, var(--bg)); transition: color .5s; }
.last-line .em { text-decoration: underline; text-decoration-thickness: .045em; text-underline-offset: .14em; transition: text-decoration-thickness .4s; }
.last-line:hover .q { color: var(--muted); }
.last-line:hover .em { text-decoration-thickness: .08em; }
.last-foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px 28px; padding-block: clamp(36px, 5vw, 64px) 32px; }
.last-foot nav { display: flex; gap: 26px; flex-wrap: wrap; }
.last-foot .addr { font-family: var(--mono); font-size: var(--s-1); color: var(--muted); user-select: all; }
.btn { display: inline-flex; align-items: center; gap: 14px; width: fit-content; padding: 18px 28px; border-radius: 999px; border: 1px solid currentColor; font-size: var(--s1); position: relative; overflow: hidden; isolation: isolate; transition: color .5s var(--ease); }
.btn::before { content: ""; position: absolute; inset: 0; background: var(--fg); border-radius: inherit; transform: translateY(101%); transition: transform .6s var(--ease); z-index: -1; }
.btn:hover { color: var(--bg); }
.btn:hover::before { transform: none; }

/* inner page header */

  return intro.text.split(' ').map((w) => {
    if (w.startsWith('[')) { hl = true; w = w.slice(1); }
    const end = w.includes(']'); w = w.replace(']', '');
    const out = `<span class="w${hl ? ' hl' : ''}">${esc(w)}</span>`;
    if (end) hl = false;
    return out;
  }).join(' ');
};

/* ---------- router ---------- */
const app = document.getElementById('app');
const header = document.querySelector('header.top');
const wipe = document.querySelector('.wipe');
let current = null, lenis = null, cleanups = [];

function parse() {
  const h = location.hash.replace(/^#/, '');
  if (h.startsWith('work-')) { const p = projects.find((x) => x.slug === h.slice(5)); if (p) return { key: 'case-' + p.slug, page: 'case', p, label: p.name }; }
  if (h === 'about') return { key: 'about', page: 'about', label: 'About' };
  if (h === 'experience') return { key: 'experience', page: 'experience', label: 'Experience' };
  if (h === 'contact') return { key: 'contact', page: 'contact', label: 'Contact' };
  if (h === 'projects') return { key: 'projects', page: 'projects', label: 'Projects' };
  return { key: 'home', page: 'home', label: 'Home', anchor: h === 'work' ? 'work' : null };
}

function render(r) {
  cleanups.forEach((f) => f()); cleanups = [];
  document.querySelector('.cursor').classList.remove('big');
  if (hasGsap) ScrollTrigger.getAll().forEach((t) => t.kill());
  app.innerHTML = r.page === 'case' ? caseStudy(r.p) : r.page === 'projects' ? projectsPage() : r.page === 'about' ? about() : r.page === 'experience' ? experiencePage() : r.page === 'contact' ? contact() : home();
  document.title = r.page === 'home' ? 'Ashwin S R · UI/UX Designer' : `${r.label} · Ashwin S R`;
  current = r.key;
  if (lenis) lenis.scrollTo(0, { immediate: true }); else window.scrollTo(0, 0);
  document.querySelectorAll('[data-nav]').forEach((a) => a.setAttribute('aria-current', String(a.dataset.nav === (r.page === 'case' ? 'projects' : r.page))));
  enhance(r);
  if (r.anchor) requestAnimationFrame(() => { const el = document.getElementById(r.anchor); if (el) lenis ? lenis.scrollTo(el, { offset: -90, duration: 1.4 }) : el.scrollIntoView(); });
}

function go() {
  const r = parse();
  if (r.key === current) {
    if (r.anchor) { const el = document.getElementById(r.anchor); if (el) lenis ? lenis.scrollTo(el, { offset: -90, duration: 1.4 }) : el.scrollIntoView(); }
    else if (r.page === 'home') lenis ? lenis.scrollTo(0, { duration: 1.4 }) : window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  if (!hasGsap || current === null) { render(r); return; }
  const label = wipe.querySelector('span'); label.textContent = r.label;
  gsap.timeline()
    .set(wipe, { y: 0, yPercent: 100, visibility: 'visible' }).set(label, { y: 0, yPercent: 110 })
    .to(wipe, { yPercent: 0, duration: 0.7, ease: 'power4.inOut' })
    .to(label, { yPercent: 0, duration: 0.5, ease: 'power3.out' }, '-=0.25')
    .add(() => { try { render(r); } catch (e) { console.error(e); } })
    .to(label, { yPercent: -110, duration: 0.4, ease: 'power3.in' }, '+=0.15')
    .to(wipe, { yPercent: -100, duration: 0.8, ease: 'power4.inOut' }, '-=0.1')
    .set(wipe, { yPercent: 100, visibility: 'hidden' });
}

/* ---------- motion ---------- */
function enhance(r) {
  const onHero = r.page === 'home';
  header.classList.toggle('over', onHero);
  header.classList.remove('solid', 'hide');

  // header: over hero / solid / hide on scroll down
  let last = 0;
  const onScroll = () => {
    const y = window.scrollY, hero = document.querySelector('[data-hero]');
    const over = hero && y < hero.offsetHeight - 70;
    header.classList.toggle('over', !!over);
    header.classList.toggle('solid', !over && y > 20);
    last = y;
  };
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  cleanups.push(() => window.removeEventListener('scroll', onScroll));

  fitHero(); bindCopy(); bindTint(); bindMagnetic(); bindFollow(); bindReveal(); bindFilters();
  if (!hasGsap) return;

  // headline lines rise from masks
  document.querySelectorAll('[data-split], [data-hero-h1]').forEach((el) => {
    const inner = el.querySelectorAll('.line > span');
    const isHero = el.matches('[data-hero-h1]');
    gsap.fromTo(inner, { yPercent: 110 }, { yPercent: 0, duration: 1.2, ease: 'power4.out', stagger: 0.14, delay: isHero ? 0.35 : 0,
      scrollTrigger: isHero ? null : { trigger: el, start: 'top 88%' } });
  });
  document.querySelectorAll('[data-hero-row]').forEach((el) => gsap.from(el, { opacity: 0, y: 30, duration: 1.1, delay: 0.8, ease: 'power3.out' }));

  document.querySelectorAll('[data-sides] .line').forEach((ln, k) => {
    gsap.fromTo(ln, { x: () => (k ? 1 : -1) * window.innerWidth * 0.18 }, { x: 0, ease: 'none', scrollTrigger: { trigger: ln, start: 'top bottom', end: 'top 45%', scrub: 0.4, invalidateOnRefresh: true } });
  });

  // fade up, batched for a stagger
  ScrollTrigger.batch('[data-fade]', { start: 'top 92%', onEnter: (els) => gsap.to(els, { opacity: 1, y: 0, duration: 1, ease: 'power3.out', stagger: 0.08, overwrite: true }) });

  // hero: "Hello" lifts away while the name line slides sideways; the bio settles in
  const hero = document.querySelector('[data-hero]');
  if (hero) {
    const media = hero.querySelectorAll('video, .poster');
    gsap.fromTo(media, { scale: 1.15 }, { scale: 1, duration: 2.4, ease: 'power3.out' });
    const l1 = hero.querySelector('.l1'), l2 = hero.querySelector('.l2');
    const tl = gsap.timeline({ scrollTrigger: { trigger: hero, start: 'top top', end: 'bottom bottom', scrub: 0.35, invalidateOnRefresh: true } });
    tl.to(l1, { x: () => window.innerWidth * 0.55, ease: 'none', duration: 1 }, 0)
      .to(l2, { x: () => -window.innerWidth * 0.55, ease: 'none', duration: 1 }, 0)
      .to(media, { scale: 1.12, ease: 'none', duration: 1 }, 0)
      .to(hero.querySelector('.hero-h1'), { opacity: 0.25, ease: 'none', duration: 0.35 }, 0.65);
  }

  // marquee: drifts on its own, speeds up and flips with scroll direction
  const track = document.querySelector('.marquee-track');
  if (track) {
    const loop = gsap.to(track, { xPercent: -50, duration: 28, ease: 'none', repeat: -1 });
    ScrollTrigger.create({ onUpdate: (s) => { gsap.to(loop, { timeScale: s.direction * Math.min(4, 1 + Math.abs(s.getVelocity()) / 400), duration: 0.3, overwrite: true }); } });
    cleanups.push(() => loop.kill());
  }

  // intro paragraph lights up word by word
  document.querySelectorAll('[data-words]').forEach((el) => {
    gsap.to(el.querySelectorAll('.w'), { opacity: 1, stagger: 0.05, ease: 'none', scrollTrigger: { trigger: el, start: 'top 80%', end: 'bottom 45%', scrub: true } });
  });

  // number counters
  document.querySelectorAll('[data-count]').forEach((el) => {
    const n = +el.dataset.count, suf = el.dataset.suffix || '', o = { v: 0 };
    gsap.to(o, { v: n, duration: 1.6, ease: 'power2.out', scrollTrigger: { trigger: el, start: 'top 90%' }, onUpdate: () => { el.textContent = Math.round(o.v) + suf; } });
  });

  // process: top rules draw across as you scroll
  document.querySelectorAll('[data-steps] li').forEach((li, k) => {
    gsap.fromTo(li, { '--p': 0 }, { '--p': 1, ease: 'none', scrollTrigger: { trigger: li, start: 'top 90%', end: 'top 55%', scrub: true } });
  });

  // case images: clip-open as they arrive, inner parallax while scrolling
  document.querySelectorAll('[data-scale]').forEach((el) => {
    gsap.to(el, { clipPath: 'inset(0% 0% 0% 0% round 6px)', duration: 1.4, ease: 'power3.out', scrollTrigger: { trigger: el, start: 'top 90%' } });
    const pz = el.querySelector('[data-pz]');
    if (pz) gsap.fromTo(pz, { yPercent: -5 }, { yPercent: 5, ease: 'none', scrollTrigger: { trigger: el, start: 'top bottom', end: 'bottom top', scrub: true } });
  });

  // last line drifts with scroll too (phones have no pointer)
  if (!fine) document.querySelectorAll('[data-follow]').forEach((el) => {
    gsap.fromTo(el, { x: 0 }, { x: () => -Math.max(0, el.scrollWidth - window.innerWidth), ease: 'none', scrollTrigger: { trigger: el, start: 'top 80%', end: 'bottom 55%', scrub: 0.4, invalidateOnRefresh: true } });
  });

  ScrollTrigger.refresh();
}

/* micro interactions */
function bindCopy() {
  app.querySelectorAll('[data-copy]').forEach((b) => b.addEventListener('click', async () => {
    const el = document.getElementById(b.dataset.copy), t = b.querySelector('.t'), orig = t.textContent;
    try { await navigator.clipboard.writeText(el.textContent); t.textContent = 'Copied'; }
    catch { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = 'Selected, press Ctrl+C'; }
    b.classList.add('done');
    setTimeout(() => { t.textContent = orig; b.classList.remove('done'); }, 1800);
  }));
}

const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
const mouse = { x: innerWidth / 2, y: innerHeight / 2 };
const cursor = document.querySelector('.cursor'), cursorLabel = cursor.querySelector('span');
const cpos = { x: mouse.x, y: mouse.y };
let follow = [];

if (fine) {
  addEventListener('pointermove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  addEventListener('pointerdown', () => cursor.classList.add('down'));
  addEventListener('pointerup', () => cursor.classList.remove('down'));
  document.addEventListener('pointerover', (e) => {
    const t = e.target.closest('[data-cursor]');
    if (t) { cursorLabel.textContent = t.dataset.cursor; cursor.classList.add('big'); }
  });
  document.addEventListener('pointerout', (e) => {
    const t = e.target.closest('[data-cursor]');
    if (t && !t.contains(e.relatedTarget)) cursor.classList.remove('big');
  });
  (function tick() {
    cpos.x += (mouse.x - cpos.x) * 0.22; cpos.y += (mouse.y - cpos.y) * 0.22;
    cursor.style.transform = `translate(${cpos.x}px, ${cpos.y}px)`;
    follow.forEach((f) => {
      const span = Math.max(0, f.el.scrollWidth - innerWidth);
      const box = (f.el.closest('[data-last]') || f.el).getBoundingClientRect();
      const over = mouse.y >= box.top && mouse.y <= box.bottom;
      // starts with the first word in view; pans only while the pointer is in the footer
      const t = Math.min(1, Math.max(0, (mouse.x / innerWidth - 0.15) / 0.7));
      const target = over ? -span * t : 0;
      f.x += (target - f.x) * 0.14;
      f.el.style.transform = `translateX(${f.x.toFixed(1)}px)`;
    });
    requestAnimationFrame(tick);
  })();
}

function fitHero() {
  document.querySelectorAll('[data-fit]').forEach((line) => {
    const inner = line.firstElementChild, box = line.parentElement;
    line.style.fontSize = '100px';
    const w = inner.getBoundingClientRect().width || 1;
    const avail = box.clientWidth;
    line.style.fontSize = Math.max(28, (100 * avail * parseFloat(line.dataset.fit)) / w) + 'px';
  });
}
let fitT;
addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(() => { fitHero(); if (hasGsap) ScrollTrigger.refresh(); }, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fitHero(); if (hasGsap) ScrollTrigger.refresh(); });

function bindReveal() {
  app.querySelectorAll('[data-ri]').forEach((box) => {
    const mask = box.querySelector('.ri-mask');
    const st = { x: 0, y: 0, tx: 0, ty: 0, r: 0, tr: 0, run: false };
    const R = () => Math.max(70, Math.min(170, box.clientWidth * 0.14));
    const loop = () => {
      st.x += (st.tx - st.x) * 0.16; st.y += (st.ty - st.y) * 0.16; st.r += (st.tr - st.r) * 0.14;
      mask.style.clipPath = `circle(${st.r.toFixed(1)}px at ${st.x.toFixed(1)}px ${st.y.toFixed(1)}px)`;
      if (Math.abs(st.tr - st.r) > 0.3 || Math.abs(st.tx - st.x) > 0.3 || Math.abs(st.ty - st.y) > 0.3) requestAnimationFrame(loop); else st.run = false;
    };
    const kick = () => { if (!st.run) { st.run = true; requestAnimationFrame(loop); } };
    const at = (e) => { const r = mask.getBoundingClientRect(); st.tx = e.clientX - r.left; st.ty = e.clientY - r.top; };
    box.addEventListener('pointerenter', (e) => { at(e); st.x = st.tx; st.y = st.ty; st.tr = R(); kick(); if (e.pointerType !== 'touch') cursor.style.opacity = 0; });
    box.addEventListener('pointermove', (e) => { at(e); kick(); });
    box.addEventListener('pointerleave', () => { st.tr = 0; kick(); cursor.style.opacity = ''; });
    let hideT;
    box.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') return; at(e); st.x = st.tx; st.y = st.ty; st.tr = R(); kick(); clearTimeout(hideT); hideT = setTimeout(() => { st.tr = 0; kick(); }, 2200); });
  });
}

function bindFilters() {
  const grid = app.querySelector('[data-pgrid]');
  if (!grid) return;
  app.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
    app.querySelectorAll('[data-filter]').forEach((x) => x.classList.toggle('on', x === b));
    const c = b.dataset.filter;
    const cards = [...grid.children];
    const show = cards.filter((el) => c === 'All' || el.dataset.cat === c);
    const go = () => {
      cards.forEach((el) => { el.hidden = !show.includes(el); });
      if (hasGsap) { gsap.fromTo(show, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out', stagger: 0.06, overwrite: true }); ScrollTrigger.refresh(); }
    };
    if (hasGsap) gsap.to(cards.filter((el) => !el.hidden), { opacity: 0, y: -16, duration: 0.25, ease: 'power2.in', onComplete: go, overwrite: true }); else go();
  }));
}

function bindTint() {
  app.querySelectorAll('[data-tintable]').forEach((sec) => {
    const rows = sec.querySelectorAll('[data-row]');
    rows.forEach((row) => {
      row.addEventListener('pointerenter', (e) => {
        if (e.pointerType === 'touch') return;
        rows.forEach((r) => r.classList.toggle('on', r === row));
        sec.style.setProperty('--tint', tints[row.dataset.row]);
        sec.classList.add('tint');
      });
    });
    sec.querySelector('.index').addEventListener('pointerleave', () => { sec.classList.remove('tint'); rows.forEach((r) => r.classList.remove('on')); });
  });
}

function bindFollow() {
  follow = fine ? [...app.querySelectorAll('[data-follow]')].map((el) => ({ el, x: 0 })) : [];
}

function bindMagnetic() {
  if (!fine) return;
  app.querySelectorAll('[data-magnetic]').forEach((el) => {
    const move = (e) => { const r = el.getBoundingClientRect(); const x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2; el.style.transform = `translate(${x * 0.3}px, ${y * 0.4}px)`; };
    const leave = () => { el.style.transition = 'transform .7s cubic-bezier(.16,1,.3,1), color .5s'; el.style.transform = ''; setTimeout(() => (el.style.transition = ''), 700); };
    el.addEventListener('pointermove', move); el.addEventListener('pointerleave', leave);
  });
}

/* smooth scroll */
if (hasGsap && window.Lenis) {
  lenis = new Lenis({ duration: 1.15, smoothWheel: true });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add((t) => lenis.raf(t * 1000));
  gsap.ticker.lagSmoothing(0);
}

document.querySelector('.brand').addEventListener('click', (e) => {
  if (parse().key === 'home') { e.preventDefault(); if (location.hash) history.replaceState(null, '', location.pathname + location.search); lenis ? lenis.scrollTo(0, { duration: 1.4 }) : window.scrollTo({ top: 0, behavior: 'smooth' }); }
});
/* background music: generated live in the browser (Web Audio), so there is no file and no licence to worry about */
const sndBtn = document.getElementById('snd-btn');
const music = (() => {
  let ctx, out, timer, on = false, step = 0;
  const chords = [[57, 64, 67, 71, 74], [53, 60, 64, 67, 72], [48, 55, 59, 64, 67], [55, 59, 62, 64, 69]]; // Am9, Fmaj7, Cmaj7, G6
  const scale = [69, 72, 74, 76, 79, 81, 84];
  const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
  function build() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    out = ctx.createGain(); out.gain.value = 0;
    const comp = ctx.createDynamicsCompressor(); out.connect(comp); comp.connect(ctx.destination);
    // soft reverb from a decaying noise impulse
    const len = ctx.sampleRate * 3.5, ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
    const verb = ctx.createConvolver(); verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.55; verb.connect(wet); wet.connect(out);
    music.bus = ctx.createGain(); music.bus.connect(out); music.bus.connect(verb);
  }
  function pad(notes, t, dur) {
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = 0.3; lp.connect(music.bus);
    notes.forEach((m, i) => {
      [-4, 4].forEach((det) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = i === 0 ? 'sine' : 'triangle'; o.frequency.value = hz(i === 0 ? m - 12 : m); o.detune.value = det;
        const v = i === 0 ? 0.05 : 0.016;
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 2.2); g.gain.setValueAtTime(v, t + dur - 1.6); g.gain.linearRampToValueAtTime(0, t + dur + 1.2);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t + dur + 1.4);
      });
    });
  }
  function pluck(m, t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.03, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 2.8);
    o.connect(g); g.connect(music.bus); o.start(t); o.stop(t + 3);
  }
  function bar() {
    const bar = 6.4, t = ctx.currentTime + 0.1;
    pad(chords[step % 4], t, bar);
    for (let k = 0; k < 4; k++) if (Math.random() < 0.6) pluck(scale[Math.floor(Math.random() * scale.length)], t + k * 1.6 + Math.random() * 0.3);
    step++;
  }
  return {
    get on() { return on; },
    toggle() {
      on = !on;
      if (on) {
        if (!ctx) build();
        ctx.resume();
        out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setTargetAtTime(0.9, ctx.currentTime, 0.8);
        if (!timer) { bar(); timer = setInterval(bar, 6400); }
      } else if (ctx) {
        out.gain.cancelScheduledValues(ctx.currentTime); out.gain.setTargetAtTime(0, ctx.currentTime, 0.35);
        clearInterval(timer); timer = null;
        setTimeout(() => { if (!on) ctx.suspend(); }, 1600);
      }
      return on;
    },
  };
})();
sndBtn.addEventListener('click', () => {
  const on = music.toggle();
  sndBtn.setAttribute('aria-pressed', String(on));
  sndBtn.setAttribute('aria-label', on ? 'Pause background music' : 'Play background music');
  sndBtn.querySelector('.snd-t').textContent = on ? 'Sound on' : 'Sound off';
});
document.addEventListener('visibilitychange', () => { if (document.hidden && music.on) sndBtn.click(); });

const menuBtn = document.getElementById('menu-btn'), mmenu = document.getElementById('mmenu');
function setMenu(open) {
  document.documentElement.classList.toggle('menu-open', open);
  menuBtn.setAttribute('aria-expanded', String(open));
  menuBtn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
  mmenu.setAttribute('aria-hidden', String(!open));
  if (lenis) open ? lenis.stop() : lenis.start();
  document.body.style.overflow = open ? 'hidden' : '';
}
menuBtn.addEventListener('click', () => setMenu(!document.documentElement.classList.contains('menu-open')));
mmenu.addEventListener('click', (e) => { if (e.target.closest('a[data-mnav]')) setMenu(false); });
addEventListener('keydown', (e) => { if (e.key === 'Escape') setMenu(false); });
matchMedia('(min-width: 761px)').addEventListener('change', (e) => { if (e.matches) setMenu(false); });
const markMenu = () => { const k = parse().page; document.querySelectorAll('[data-mnav]').forEach((a) => a.setAttribute('aria-current', String(a.dataset.mnav === (k === 'case' ? 'projects' : k)))); };
addEventListener('hashchange', markMenu);
addEventListener('hashchange', go);
go(); markMenu();
